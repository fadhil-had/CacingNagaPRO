name: AI Financial Advisor Bot

on:
  # Pemicu 1: Manual Trigger dari Tab Actions GitHub (Bisa input kode saham)
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Masukkan Kode Saham (contoh: BBRI.JK atau ^JKSE)'
        required: true
        default: 'BBRI.JK'

  # Pemicu 2: Otomatis setiap hari Senin - Jumat jam 17:00 WIB (10:00 UTC) setelah bursa tutup
  schedule:
    - cron: '0 10 * * 1-5'

jobs:
  run-analisis:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance google-genai pandas

    - name: Jalankan Analisis Saham
      env:
        # Masukkan API Key Gemini Anda di GitHub Secrets dengan nama GEMINI_API_KEY
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Menggunakan input manual jika dipicu lewat workflow_dispatch, 
        # atau default ke '^JKSE' (IHSG) jika jalan otomatis lewat cron schedule.
        TICKER_SYMBOL="${{ github.event.inputs.ticker }}"
        if [ -z "$TICKER_SYMBOL" ]; then
          TICKER_SYMBOL="^JKSE"
        fi
        
        python bot_financial.py $TICKER_SYMBOL