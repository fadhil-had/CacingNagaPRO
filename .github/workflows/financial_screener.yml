name: IDX Stock Screener

permissions:
  contents: read

on:
  schedule:
    # GitHub cron uses UTC. These are 18:00, 18:15, and 18:30 WIB.
    - cron: '0 11 * * 1-5'  # Daily after each weekday market close.
    - cron: '15 11 * * 5'   # Weekly after the Friday candle closes.
    - cron: '30 11 1 * *'   # Monthly: day 1 reads the completed prior month.
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Final screener to run'
        required: true
        default: 'daily_swing'
        type: choice
        options:
          - daily_swing
          - weekly_position
          - monthly_long_term

jobs:
  screen-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify final screener
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          pytest -q
          python3 tests/backtest_engine.py --self-test

      - name: Select scheduled timeframe
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_TIMEFRAME: ${{ inputs.timeframe }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            timeframe="$MANUAL_TIMEFRAME"
          elif [ "$EVENT_SCHEDULE" = "0 11 * * 1-5" ]; then
            timeframe="daily_swing"
          elif [ "$EVENT_SCHEDULE" = "15 11 * * 5" ]; then
            timeframe="weekly_position"
          elif [ "$EVENT_SCHEDULE" = "30 11 1 * *" ]; then
            timeframe="monthly_long_term"
          else
            echo "Unknown workflow trigger: $EVENT_NAME / $EVENT_SCHEDULE" >&2
            exit 1
          fi
          case "$timeframe" in
            daily_swing) period="2y" ;;        # needs at least 260 daily bars
            weekly_position) period="5y" ;;    # needs at least 120 weekly bars
            monthly_long_term) period="10y" ;; # needs at least 72 monthly bars
          esac
          echo "timeframe=$timeframe" >> "$GITHUB_OUTPUT"
          echo "period=$period" >> "$GITHUB_OUTPUT"

      - name: Run final screener
        env:
          SELECTED_TIMEFRAME: ${{ steps.config.outputs.timeframe }}
          SELECTED_PERIOD: ${{ steps.config.outputs.period }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
        run: |
          python3 scripts/financial_screener.py \
            --timeframe "$SELECTED_TIMEFRAME" \
            --period "$SELECTED_PERIOD" \
            --workers 8 \
            --top 3 \
            --output-dir "output/screener/$SELECTED_TIMEFRAME"

      - name: Publish result summary
        if: always()
        env:
          SELECTED_TIMEFRAME: ${{ steps.config.outputs.timeframe }}
          SELECTED_PERIOD: ${{ steps.config.outputs.period }}
        run: |
          result_dir="output/screener/$SELECTED_TIMEFRAME"
          report="$result_dir/${SELECTED_TIMEFRAME}_report.md"
          csv="$result_dir/${SELECTED_TIMEFRAME}.csv"
          {
            echo "## IDX Stock Screener"
            echo
            echo "| Parameter | Nilai |"
            echo "| :--- | :--- |"
            echo "| Timeframe | \`$SELECTED_TIMEFRAME\` |"
            echo "| Market-data period | \`$SELECTED_PERIOD\` |"
            echo
            if [ -f "$report" ]; then
              echo "### Hasil"
              cat "$report"
            elif [ -f "$csv" ]; then
              echo "### Hasil"
              echo "Tidak ada kandidat valid untuk masuk Top 3 pada run ini."
            else
              echo "### Hasil tidak tersedia"
              echo "Screener tidak menghasilkan file output; periksa log step **Run final screener**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: screener-${{ steps.config.outputs.timeframe }}-${{ github.run_id }}
          path: output/screener/
          if-no-files-found: error
          retention-days: 90
