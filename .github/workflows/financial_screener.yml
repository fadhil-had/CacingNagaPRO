name: AI Auto Stock Screener

on:
  workflow_dispatch:
    inputs:
      saham_manual:
        description: 'Beri kode saham (pisahkan spasi) untuk mode MANUAL, KOSONGKAN jika ingin mode OTOMATIS.'
        required: false
        default: ''

  schedule:
    - cron: '0 10 * * 1-5' # Otomatis jalan jam 17:00 WIB (Senin-Jumat) dalam mode Otomatis

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance google-genai pandas

    - name: Run Screener Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Diperbarui: Menjalankan skrip dari path .github/scripts/
        python .github/scripts/bot_financial_screener.py ${{ github.event.inputs.saham_manual }}