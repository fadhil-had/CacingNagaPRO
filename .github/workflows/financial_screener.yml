name: Automated IDX Stock Screener

on:
  schedule:
    # Berjalan otomatis setiap hari kerja jam 09:00 UTC (16:00 WIB) setelah bursa tutup
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    # Mengaktifkan tombol untuk menjalankan workflow secara manual dari GitHub UI
    inputs:
      trend_mode:
        description: 'Pilih rentang waktu tren trading'
        required: true
        default: '1hari'
        type: choice
        options:
          - 1hari
          - 1minggu
          - 1bulan
          - all
      ticker:
        description: 'Kode saham (opsional, hanya bersama trend_mode=all) untuk analisis 3 timeframe'
        required: false
        default: ''
        type: string

jobs:
  screen-stocks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12' # Diperbaiki dari 'python-node-version' ke 'python-version'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip check

    - name: Run Stock Screener (Scheduled)
      if: github.event_name == 'schedule'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
      run: |
        # Menggunakan mode daily untuk run harian yang lebih presisi
        python scripts/financial_screener.py --trend 1hari

    - name: Run Stock Screener (Manual Trigger)
      if: github.event_name == 'workflow_dispatch'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
      run: |
        # Mode 1: trend_mode 1hari/1minggu/1bulan (tanpa ticker) -> rekomendasi saham + analisa
        # Mode 2: trend_mode=all + ticker        -> analisis 1 saham di 3 timeframe
        # Error  : trend_mode=all tanpa ticker   -> "Jangan semua timeframe, berat"
        if [ -n "${{ github.event.inputs.ticker }}" ]; then
          python scripts/financial_screener.py --trend all --ticker "${{ github.event.inputs.ticker }}"
        else
          python scripts/financial_screener.py --trend "${{ github.event.inputs.trend_mode }}"
        fi