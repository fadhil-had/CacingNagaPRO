name: IDX Stock Screener

permissions:
  contents: read

on:
  schedule:
    # Friday 17:00 WIB, after the weekly candle has closed.
    - cron: '0 10 * * 5'
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Final screener to run'
        required: true
        default: 'weekly_position'
        type: choice
        options:
          - weekly_position
          - monthly_long_term

jobs:
  screen-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run final screener
        env:
          SELECTED_TIMEFRAME: ${{ github.event.inputs.timeframe || 'weekly_position' }}
        run: |
          python3 scripts/financial_screener.py \
            --timeframe "$SELECTED_TIMEFRAME" \
            --period 10y \
            --workers 8 \
            --top 3 \
            --output-dir "output/screener/$SELECTED_TIMEFRAME"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: screener-${{ github.event.inputs.timeframe || 'weekly_position' }}-${{ github.run_id }}
          path: output/screener/
          if-no-files-found: error
          retention-days: 90
